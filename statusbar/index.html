<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <link rel="stylesheet" href="../style.css" type="text/css" />
    <title>ステータスバー</title>
  </head>
  <body>
    <h4><a name="name">ステータスバー</a></h4>

    <hr size="2" />
    <img alt="ステータスバー" src="statusbar.png" usemap="#map_statusbar" />
    <map name="map_statusbar">
      <area
        href="#statuslabel"
        shape="rect"
        alt="ステータスラベル"
        coords="3,4,470,21"
      />
      <area
        href="#progressbar"
        shape="rect"
        alt="プログレスバー"
        coords="470,5,572,19"
      />
    </map>
    <div class="indent">
      <p>アプリケーションの状態を表示します。</p>
    </div>

    <hr size="2" />
    <div class="indent">
      <h4><a name="statuslabel">ステータスラベル</a></h4>
      <img alt="ステータスラベル" src="statusbar_statuslabel.png" />
      <div class="indent">
        <p>アプリケーションの動作メッセージが表示されます。</p>
        <p>検索中は、検索しているフォルダを表示します。</p>
        <p>エラーが発生した時は、そのエラーを表示します。</p>
      </div>

      <hr size="2" />
      <h4><a name="progressbar">プログレスバー</a></h4>
      <img alt="プログレスバー" src="statusbar_progressbar.png" />
      <div class="indent">
        <p>ファイル検索の進捗状況を表示します。</p>
      </div>
    </div>
  </body>
</html>
