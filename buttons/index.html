<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <link rel="stylesheet" href="../style.css" type="text/css" />
    <title>ボタン</title>
  </head>
  <body>
    <h4>ボタン</h4>

    <hr size="2" />
    <img alt="ボタン" src="buttons.png" usemap="#map_buttons" />
    <map name="map_buttons">
      <area
        href="../buttons/index.html#start"
        shape="rect"
        alt="検索開始"
        coords="0,0,83,21"
      />
      <area
        href="../buttons/index.html#quit"
        shape="rect"
        alt="終了"
        coords="0,29,83,50"
      />
      <area
        href="../buttons/index.html#clear"
        shape="rect"
        alt="新しい条件"
        coords="0,58,83,79"
      />
    </map>
    <div class="indent">
      <h5><a name="start">検索開始</a></h5>
      <div class="indent">
        <p>検索を開始します。</p>
        <p>検索実行中はクリック出来ません。</p>
      </div>
      <h5><a name="quit">終了</a></h5>
      <div class="indent">
        <p>検索を中断します。</p>
        <p>検索実行中以外はクリック出来ません。</p>
      </div>
      <h5><a name="clear">新しい条件</a></h5>
      <div class="indent">
        <p>検索条件を既定に戻します。</p>
        <p>検索実行中はクリック出来ません。</p>
      </div>
    </div>
  </body>
</html>
